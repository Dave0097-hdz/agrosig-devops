<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900" width="1700" height="900" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
  </defs>
  <rect width="1700" height="900" fill="#ffffff"/>

  <text x="40" y="55" font-size="28" font-weight="700" fill="#0f172a">AgroSig Backend: arquitectura DevOps en Azure</text>
  <text x="40" y="85" font-size="14" fill="#475569">API REST Node.js + Express + PostgreSQL/PostGIS · contenedor Docker · CI/CD con Azure DevOps · infraestructura como código con Bicep</text>

  <!-- Grupos -->
  <rect x="310" y="120" width="360" height="580" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="330" y="150" font-size="16" font-weight="700" fill="#1e3a8a">Azure DevOps Pipeline</text>
  <rect x="730" y="120" width="930" height="580" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="750" y="150" font-size="16" font-weight="700" fill="#0f172a">Azure · Resource Group rg-agrosig · mexicocentral</text>

  <!-- Desarrollo -->
  <rect x="40" y="185" width="220" height="90" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
  <text x="150" y="215" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">GitHub</text>
  <text x="150" y="238" font-size="12" text-anchor="middle" fill="#475569">Dave0097-hdz/agrosig-devops</text>
  <text x="150" y="257" font-size="12" text-anchor="middle" fill="#475569">server/ · infra/ · docs/</text>

  <rect x="40" y="345" width="220" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="150" y="375" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Desarrollador</text>
  <text x="150" y="397" font-size="12" text-anchor="middle" fill="#475569">commit a la rama main</text>

  <!-- Etapas del pipeline -->
  <rect x="340" y="180" width="300" height="100" rx="10" fill="#E8F1FD" stroke="#2563EB" stroke-width="1.8"/>
  <text x="490" y="210" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">1 · Tests</text>
  <text x="490" y="234" font-size="12" text-anchor="middle" fill="#334155">Jest + Supertest</text>
  <text x="490" y="254" font-size="12" text-anchor="middle" fill="#334155">PostGIS efímero + migraciones</text>

  <rect x="340" y="340" width="300" height="100" rx="10" fill="#E8F1FD" stroke="#2563EB" stroke-width="1.8"/>
  <text x="490" y="370" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">2 · Build y Push</text>
  <text x="490" y="394" font-size="12" text-anchor="middle" fill="#334155">docker build ./server</text>
  <text x="490" y="414" font-size="12" text-anchor="middle" fill="#334155">imagen etiquetada con BuildId</text>

  <rect x="340" y="500" width="300" height="100" rx="10" fill="#E8F1FD" stroke="#2563EB" stroke-width="1.8"/>
  <text x="490" y="530" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">3 · Deploy</text>
  <text x="490" y="554" font-size="12" text-anchor="middle" fill="#334155">az deployment (Bicep)</text>
  <text x="490" y="574" font-size="12" text-anchor="middle" fill="#334155">nueva revisión de Container Apps</text>

  <!-- Recursos de Azure -->
  <rect x="770" y="340" width="210" height="100" rx="10" fill="#E7F6EC" stroke="#16A34A" stroke-width="1.8"/>
  <text x="875" y="370" font-size="16" font-weight="700" text-anchor="middle" fill="#14532d">Container Registry</text>
  <text x="875" y="394" font-size="12" text-anchor="middle" fill="#334155">ACR Basic</text>
  <text x="875" y="414" font-size="12" text-anchor="middle" fill="#334155">imagen agrosig-api</text>

  <rect x="1080" y="330" width="270" height="120" rx="10" fill="#E7F6EC" stroke="#16A34A" stroke-width="1.8"/>
  <text x="1215" y="360" font-size="16" font-weight="700" text-anchor="middle" fill="#14532d">Container Apps</text>
  <text x="1215" y="384" font-size="12" text-anchor="middle" fill="#334155">API AgroSig (Express)</text>
  <text x="1215" y="404" font-size="12" text-anchor="middle" fill="#334155">ingress HTTPS · 1 réplica</text>
  <text x="1215" y="424" font-size="12" text-anchor="middle" fill="#334155">probes /health y /health/db</text>

  <rect x="1080" y="170" width="270" height="80" rx="10" fill="#FFF4DB" stroke="#D97706" stroke-width="1.8"/>
  <text x="1215" y="200" font-size="16" font-weight="700" text-anchor="middle" fill="#78350f">Managed Identity</text>
  <text x="1215" y="224" font-size="12" text-anchor="middle" fill="#334155">AcrPull + Key Vault Secrets User</text>

  <rect x="1450" y="170" width="190" height="80" rx="10" fill="#FFF4DB" stroke="#D97706" stroke-width="1.8"/>
  <text x="1545" y="200" font-size="16" font-weight="700" text-anchor="middle" fill="#78350f">Key Vault</text>
  <text x="1545" y="224" font-size="12" text-anchor="middle" fill="#334155">JWT, BD, API keys</text>

  <rect x="1450" y="340" width="190" height="100" rx="10" fill="#F1EAFB" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="1545" y="370" font-size="16" font-weight="700" text-anchor="middle" fill="#4c1d95">PostgreSQL</text>
  <text x="1545" y="394" font-size="12" text-anchor="middle" fill="#334155">Flexible Server 16 + PostGIS</text>
  <text x="1545" y="414" font-size="12" text-anchor="middle" fill="#334155">SSL obligatorio</text>

  <rect x="1450" y="520" width="190" height="100" rx="10" fill="#EEF1F4" stroke="#64748B" stroke-width="1.8"/>
  <text x="1545" y="550" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">Log Analytics</text>
  <text x="1545" y="574" font-size="12" text-anchor="middle" fill="#334155">logs de la API</text>
  <text x="1545" y="594" font-size="12" text-anchor="middle" fill="#334155">cuota diaria 0.5 GB</text>

  <!-- Cliente -->
  <rect x="1080" y="760" width="270" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="1215" y="790" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Cliente HTTP</text>
  <text x="1215" y="812" font-size="12" text-anchor="middle" fill="#475569">app móvil / web · Swagger</text>

  <!-- Flechas -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="150" y1="345" x2="150" y2="278"/>
    <line x1="260" y1="230" x2="338" y2="230"/>
    <line x1="490" y1="280" x2="490" y2="338"/>
    <line x1="490" y1="440" x2="490" y2="498"/>
    <line x1="640" y1="390" x2="768" y2="390"/>
    <line x1="980" y1="370" x2="1078" y2="370"/>
    <path d="M640 550 L1030 550 L1030 425 L1078 425"/>
    <line x1="1350" y1="390" x2="1448" y2="390"/>
    <path d="M1350 430 L1400 430 L1400 570 L1448 570"/>
    <line x1="1215" y1="758" x2="1215" y2="452"/>
  </g>
  <g stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#ahd)">
    <line x1="1215" y1="330" x2="1215" y2="252"/>
    <line x1="1350" y1="210" x2="1448" y2="210"/>
    <path d="M1080 210 L875 210 L875 338"/>
  </g>

  <!-- Etiquetas de flechas -->
  <g font-size="12" fill="#334155">
    <text x="162" y="317">git push</text>
    <text x="299" y="216" text-anchor="middle">trigger</text>
    <text x="502" y="314">tests OK</text>
    <text x="502" y="474">imagen en ACR</text>
    <text x="704" y="378" text-anchor="middle">push imagen</text>
    <text x="1029" y="358" text-anchor="middle">pull</text>
    <text x="835" y="540" text-anchor="middle">az deployment group create</text>
    <text x="1399" y="378" text-anchor="middle">SSL 5432</text>
    <text x="1392" y="505" text-anchor="end">logs</text>
    <text x="1227" y="620">HTTPS</text>
  </g>
  <g font-size="12" fill="#92400e">
    <text x="1227" y="295">usa identidad</text>
    <text x="1399" y="198" text-anchor="middle">lee secretos</text>
    <text x="980" y="200" text-anchor="middle">AcrPull</text>
  </g>

  <!-- Decisiones de diseño -->
  <rect x="40" y="740" width="980" height="120" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="770" font-size="15" font-weight="700" fill="#0f172a">Decisiones de diseño</text>
  <g font-size="13" fill="#334155">
    <text x="60" y="798">• Infraestructura como código con Bicep (reproducible)</text>
    <text x="60" y="822">• Secretos solo en Key Vault, sin credenciales en el repo</text>
    <text x="60" y="846">• Identidad administrada con permisos RBAC mínimos</text>
    <text x="540" y="798">• 1 réplica fija: evita duplicar los crons de notificaciones</text>
    <text x="540" y="822">• Migraciones db-migrate al arrancar el contenedor</text>
  </g>
</svg>
